# Codecov reports coverage; CI's tests are the gate. It fails a pull request only when
# total coverage drops by more than 2 points, and the new lines' share is shown, not
# enforced.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true

# No pull request comment. A drop of over 2 points fails the project check, which links
# to the report. require_changes cannot express that: its coverage_drop test reads the
# threshold from coverage.status.project itself, where a valid config has none, so it
# fires on any drop at all.
comment: false

# CI uploads one report per flag. Codecov compares as soon as the first arrives, so the
# other flags' lines would count as a drop. Carryforward fills a missing report with the
# base commit's numbers for that flag.
flag_management:
  default_rules:
    carryforward: true
