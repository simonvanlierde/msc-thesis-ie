name: CI

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run tests (pytest)
        run: uv run pytest

      - name: Validate Snakemake workflow (dry-run)
        run: uv run --with snakemake snakemake --dry-run --forceall

  # Type checking with ty (Astral, pre-release). Informational for now: the
  # scientific code uses `np.array` as a type annotation in many places, which
  # ty flags. Kept visible in CI without blocking the build.
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Type check (ty)
        run: uv run ty check
