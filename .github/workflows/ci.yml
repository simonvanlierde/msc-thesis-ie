name: CI

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run tests (pytest)
        run: uv run pytest --cov --cov-report=term --cov-report=xml # source and fail_under are in pyproject.toml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: python

      - name: Validate Snakemake workflow (dry-run)
        run: uv run --with snakemake snakemake --dry-run --forceall

      # Informational for now: the scientific code uses `np.array` as a type
      # annotation in many places, which ty (pre-release) flags. A step, not its
      # own job, so it reuses the synced environment instead of billing a second
      # runner minute per PR.
      - name: Type check (ty)
        run: uv run ty check
        continue-on-error: true
