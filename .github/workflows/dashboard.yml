name: Dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          package-json-file: dashboard/package.json
          runtime: node@26
          cache: true
          cache-dependency-path: dashboard/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # pnpm check runs the unit tests with coverage, which writes coverage/lcov.info.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: dashboard/coverage/lcov.info
          flags: dashboard
      # The a11y suite shares this job's install; a separate job billed its own
      # runner minute for a second checkout and pnpm install.
      # No --with-deps: the runner has Chromium's libraries, and apt would only add
      # fonts the site does not use, from a mirror that can take minutes for them.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          package-json-file: dashboard/package.json
          runtime: node@26
          cache: true
          cache-dependency-path: dashboard/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dashboard/dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
