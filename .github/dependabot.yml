version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: [ "*" ]
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    groups:
      node:
        patterns: [ "*" ]
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: [ "*" ]
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: [ "*" ]
    cooldown:
      default-days: 3
