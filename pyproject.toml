[build-system]
  build-backend = "hatchling.build"
  requires      = ["hatchling"]

  [tool.hatch.build.targets.wheel]
    packages = ["cdm"]

[project]
  authors = [{ name = "Simon van Lierde" }]
  description = "Cooling demand and environmental impact model for residential and office buildings in The Hague (MSc Industrial Ecology thesis)."
  keywords = [
    "industrial ecology",
    "cooling demand",
    "urban heat",
    "energy modelling",
    "life cycle assessment",
    "geospatial analysis",
  ]
  license = "GPL-3.0-or-later"
  license-files = ["LICENSE"]
  name = "cooling-demand-model"
  readme = "README.md"
  requires-python = ">=3.15"
  version = "1.1.0"

  dependencies = [
    "geopandas>=1.1.4",
    "itables>=2.9.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "rasterio>=1.5.1",
    "rasterstats>=0.21.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "snakemake>=9.26.1",
    "tqdm>=4.70.0",
  ]

  [project.urls]
    Data   = "https://doi.org/10.5281/zenodo.8344580"
    Thesis = "https://repository.tudelft.nl/record/uuid:32222863-536f-464a-b8c6-6c2283a7249a"

[dependency-groups]
dataset = [
    "frictionless>=5",
    "pyarrow>=23",
]
  dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-codspeed>=5.0.3", "ruff>=0.16.6", "ty>=0.0.79", "prek>=0.5.5", "nbstripout>=0.9.1"]

# Skip releases younger than a week, matching Renovate's minimumReleaseAge,
# so a hijacked release has time to be yanked before any relock picks it up.
[tool.uv]
  exclude-newer = "7 days"

[tool.ruff]
  line-length    = 120
  target-version = "py315"

  [tool.ruff.lint]
    ignore = [
      "D203", # one-blank-line-before-class (conflicts with D211)
      "D213", # multi-line-summary-second-line (conflicts with D212)

      # We sometimes use capital letters for physical quantities (e.g. UHI) in function and variable names, which is not PEP8-compliant.
      "N802",
      "N803",
      "N806",
      "N816",

      # Line length is enforced by `ruff format`; the remaining long lines are verbose Google-style
      # docstrings, unit-laden strings and comments that cannot be wrapped without hurting readability.
      "E501",

      # The physical model functions legitimately take many parameters and boolean toggles
      # (e.g. include_time_series, save_figure), and raise ValueErrors with inline messages.
      "PLR0913", # too-many-arguments
      "PLR0917", # too-many-positional-arguments (the positional twin of PLR0913, above)
      "FBT001",  # boolean-type-hint-positional-argument
      "FBT002",  # boolean-default-value-positional-argument
      "TRY003",  # raise-vanilla-args (long messages passed to exception constructors)
      "CPY001",  # missing-copyright-notice (a thesis repo, not a licensed distribution)
    ]
    select = ["ALL"]

    # `×` and `°` are used deliberately in unit strings and docstrings.
    allowed-confusables = ["×", "°"]

    [tool.ruff.lint.per-file-ignores]
      "cdm/__init__.py" = ["D104"]
      "tests/*"               = ["D", "PLR2004", "S101"] # don't require docstrings in tests
      "benchmarks/*"          = ["D", "PLR2004", "S101"] # CodSpeed benchmarks follow the test conventions
      # Notebooks are exploratory: allow prints, commented-out code, magic values, °C/× unicode,
      # pandas .at/.values style, TODO/hack markers and formatter-conflicting trailing commas.
      # Notebook imports are used at runtime, so they must not move into type-checking blocks (TC).
      "*.ipynb" = ["T20", "ERA001", "PLR2004", "RUF001", "PD", "FIX", "COM812", "E721", "PLW2901", "TC"]
      # CLI / build scripts legitimately print progress and can carry a bit more branching.
      "docs/*" = ["T201", "INP001"]
      "scripts/dot_to_simple_svg.py" = ["C901", "PLR0912"]

    [tool.ruff.lint.pydocstyle]
      convention = "google"

[tool.coverage.run]
  branch = true
  omit   = ["cdm/figures.py"] # Plotting helpers are visual; not unit-tested
  source = ["cdm"]

[tool.coverage.report]
  # The computational core is unit-tested; the model-running wrappers in
  # sensitivity_analysis.py and the create_time_series / aggregate_results
  # orchestration are exercised via the notebooks against the full Zenodo dataset.
  exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
  fail_under   = 50

# Type-check the model and scripts against the supported Python version.
[tool.ty.environment]
  python-version = "3.15"

[tool.ty.src]
  exclude = ["**/*.ipynb"]

[tool.pytest]
  minversion = "9.0"
  testpaths = ["tests"]
  addopts = ["-ra"]
  log_level = "INFO"
  strict = true
  filterwarnings = [
    "error",
    # Rasterio 1.5 calls Affine's deprecated matrix operator; remove when Rasterio updates it.
    'ignore:Use `@` matmul instead of `\*` mul operator for matrix multiplication:PendingDeprecationWarning:rasterio.transform',
  ]

[tool.repo-review.ignore]
  PY007 = "just is the task runner; just check runs the repository checks"
  GH200 = "Renovate updates dependencies, actions and hook revisions in renovate.json5"
  PC110 = "ruff format runs as a local hook using the project environment"
  PC140 = "ty runs as a local hook and in CI"
  PC170 = "The repository documents are Markdown, not reStructuredText"
  PC190 = "ruff check runs as a local hook using the project environment"
  PC901 = "GitHub Actions runs the checks; this repository does not use pre-commit.ci"
  PC902 = "GitHub Actions runs the checks; this repository does not use pre-commit.ci"
  PC903 = "GitHub Actions runs the checks; this repository does not use pre-commit.ci"
  RF002 = "Ruff target-version is explicitly py315; requires-python has no upper bound"

# These wheels omit licence metadata; the gate verifies their exact MIT licence files first.
[tool.licensecheck]
  ignore_packages = ["conda-inject", "snakemake-interface-common", "snakemake-interface-logger-plugins", "snakemake-interface-report-plugins", "snakemake-interface-scheduler-plugins", "snakemake-interface-storage-plugins"]
